[project]
name = "leworld-interp"
version = "0.1.0"
description = "Mechanistic interpretability of action conditioning in the LeWM JEPA video world model (AEZ hypothesis)."
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "numpy",
    "scikit-learn",
    "pillow",
    "tqdm",
    "einops",
    "transformers",
    "datasets",
    "huggingface-hub",
    "safetensors",
    "pyyaml",
    "python-dotenv",
    "matplotlib",
    "pandas",
]

[dependency-groups]
dev = [
    "ipython",
    "jupyter",
    "ruff",
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"